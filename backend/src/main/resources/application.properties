spring.application.name=DocMind
docmind.allowed.origins=${DOCMIND_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Gemini API key - set via environment variable GEMINI_API_KEY (recommended)
# or paste directly here for local testing only (never commit a real key)
# Used ONLY for embeddings now (this part already works and is free)
gemini.api.key=${GEMINI_API_KEY:}

# Embedding model - used to turn text chunks into vectors
gemini.embedding.model=gemini-embedding-001

# Groq API key - set via environment variable GROQ_API_KEY (recommended)
# Get a free key at https://console.groq.com/keys - no billing card required
# Used for the actual answer-generation step (replaces Gemini generateContent)
groq.api.key=${GROQ_API_KEY}

# Generation model - used to answer questions from retrieved context
groq.model=openai/gpt-oss-20b

# Chunking config
docmind.chunk.size=800
docmind.chunk.overlap=100

# Retrieval config
docmind.retrieval.topK=4

# Max file upload size
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.port=8080
